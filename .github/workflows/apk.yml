# Builds the Android app (APK) on GitHub and publishes it on the Releases page.
name: Сборка APK

on:
  push:
    branches: [main]
    paths: ['index.html', 'icons/**', 'apk/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Зависимости
        working-directory: apk
        run: npm install --no-audit --no-fund

      - name: Веб-часть
        working-directory: apk
        run: node prepare-www.mjs

      - name: Android-проект
        working-directory: apk
        run: |
          npx cap add android
          npx cap sync android

      - name: Иконки и заставка
        working-directory: apk
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#15110E' --iconBackgroundColorDark '#15110E' --splashBackgroundColor '#15110E' --splashBackgroundColorDark '#15110E'

      - name: Номер версии
        working-directory: apk/android
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" app/build.gradle

      - name: Сборка
        working-directory: apk/android
        run: |
          mkdir -p ~/.android
          cp ../debug.keystore ~/.android/debug.keystore
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../kbju-diary.apk

      - name: Публикация
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Дневник КБЖУ — сборка ${{ github.run_number }}
          body: Скачайте kbju-diary.apk и установите поверх прежней версии. Данные сохранятся.
          files: kbju-diary.apk
          make_latest: true
