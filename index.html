<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дневник КБЖУ</title>
<meta name="theme-color" content="#111613">
<meta name="description" content="Личный дневник калорий и КБЖУ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: one narrow column like a food label — sticky header with tabs, day summary, then meal cards. */
:root {
  /* Always dark, by request. */
  --bg: #111613; --surface: #19201C; --surface-2: #151B18; --ink: #E6ECE8; --muted: #93A199;
  --line: #2A3530; --accent: #5BBE93; --accent-ink: #0D1511; --accent-soft: #1D3129;
  --prot: #5A8EE6; --fat: #C0782A; --carb: #B474CE; --warn: #F07C66; --warn-soft: #3A201B;
  --shadow: 0 1px 2px rgba(0,0,0,.3);
  color-scheme: dark;
  --font-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 14px;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
.install { border: 1px solid var(--accent); background: none; color: var(--accent); border-radius: 10px; height: 38px; padding: 0 12px; font-size: 13px; font-weight: 500; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 12px 10px; }
.brand { font-family: var(--font-display); font-weight: 600; font-size: 17px; letter-spacing: -.01em; margin: 0; flex: 1 1 auto; }
.brand span { color: var(--accent); }
.status { font-size: 12px; color: var(--muted); }
.status.err { color: var(--warn); }
.tabs { display: flex; gap: 2px; width: 100%; overflow-x: auto; scrollbar-width: none; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
.gear { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--muted); flex: none; }
.gear:hover { color: var(--ink); border-color: var(--accent); }
.gear[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.tabs button { flex: 1 1 0; min-width: 0; border: 0; background: transparent; padding: 8px 4px; font-size: 14px; border-radius: 9px; font-weight: 500; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

main .wrap { padding-block: 18px 48px; display: flex; flex-direction: column; gap: 16px; }
.notice { font-size: 13px; color: var(--muted); background: var(--surface-2); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; }

/* Day bar */
.daybar { display: flex; align-items: center; gap: 8px; }
.iconbtn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; font-size: 18px; line-height: 1; flex: none; }
.iconbtn:hover { border-color: var(--accent); }
.dayname { flex: 1; min-width: 0; text-align: center; }
.dayname b { display: block; font-family: var(--font-display); font-weight: 500; font-size: 16px; }
.dayname span { font-size: 13px; color: var(--muted); }
.todaybtn { border: 0; background: none; color: var(--accent); font-size: 13px; font-weight: 500; padding: 0; text-decoration: underline; text-underline-offset: 2px; }

/* Summary */
.summary { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.sum-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; }
.kcal-big { font-family: var(--font-display); font-weight: 600; font-size: 34px; letter-spacing: -.02em; line-height: 1; }
.kcal-big small { font-family: var(--font-body); font-weight: 400; font-size: 15px; color: var(--muted); letter-spacing: 0; margin-left: 4px; }
.left { font-size: 14px; color: var(--muted); text-align: right; }
.left b { color: var(--ink); font-weight: 600; }
.left.over b { color: var(--warn); }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .25s ease; }
.bar.over i { background: var(--warn); }
.macros { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.macro { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.macro .lbl { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.macro .val { font-size: 14px; }
.macro .val b { font-weight: 600; }
.macro .bar { height: 6px; }
.macro.p .bar i { background: var(--prot); }
.macro.f .bar i { background: var(--fat); }
.macro.c .bar i { background: var(--carb); }
.macro .bar.over i { background: var(--warn); }
.goalhint { font-size: 13px; color: var(--muted); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 500; text-decoration: underline; text-underline-offset: 2px; }

/* Meals */
.meals { display: flex; flex-direction: column; }
.meal { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; border: 1px solid transparent; }
.meal.snack { background: var(--surface-2); border: 1px dashed var(--line); box-shadow: none; }
.meal.drop-before { box-shadow: 0 -3px 0 0 var(--accent); }
.meal.drop-after { box-shadow: 0 3px 0 0 var(--accent); }
.meal.dragging { opacity: .5; }
.meal-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.meal-head h3 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 15px; }
.meal-sum { font-size: 13px; color: var(--muted); margin-left: auto; }
.meal-sum b { color: var(--ink); font-weight: 600; }
.handle { cursor: grab; color: var(--muted); font-size: 16px; padding: 2px 4px; user-select: none; touch-action: none; border: 0; background: none; }
.snack-tools { display: flex; gap: 4px; }
.mini { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; height: 28px; min-width: 28px; padding: 0 7px; font-size: 13px; color: var(--muted); }
.mini:hover:not(:disabled) { color: var(--ink); border-color: var(--accent); }
.mini:disabled { opacity: .35; cursor: default; }

.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto 64px 28px; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.iname { min-width: 0; }
.iname div { overflow-wrap: anywhere; }
.iname small { display: block; color: var(--muted); font-size: 12px; }
.qty { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); }
.qty input { width: 64px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); text-align: right; font-variant-numeric: tabular-nums; }
.qty input:focus { border-color: var(--accent); outline: none; }
.qty .pcs { font-size: 12px; min-width: 0; }
.ikcal { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.ikcal small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); }
.del { border: 0; background: none; color: var(--muted); font-size: 18px; width: 28px; height: 28px; border-radius: 8px; line-height: 1; }
.del:hover { color: var(--warn); background: var(--warn-soft); }
.empty { font-size: 13px; color: var(--muted); margin: 0; }

.addbtn { align-self: flex-start; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 12px; font-weight: 500; color: var(--accent); }
.addbtn:hover { border-color: var(--accent); }
.snack-gap { display: flex; justify-content: center; padding: 6px 0; }
.snack-gap button { border: 0; background: none; color: var(--muted); font-size: 13px; padding: 4px 10px; border-radius: 99px; opacity: .75; }
.snack-gap button:hover, .snack-gap button:focus-visible { opacity: 1; color: var(--accent); background: var(--accent-soft); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 11px; font-size: 13px; color: var(--muted); }
.chip:hover { border-color: var(--accent); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ghead { padding: 10px 16px 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; background: var(--surface-2); border: 0; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; }
.ghead:hover { color: var(--ink); }
.ghead .caret { display: inline-block; transition: transform .15s ease; font-size: 10px; }
.ghead[aria-expanded="false"] .caret { transform: rotate(-90deg); }
.ghead .gcount { font-weight: 400; letter-spacing: 0; font-variant-numeric: tabular-nums; margin-left: -4px; }
.plist .ghead:first-child { border-top: 0; border-radius: var(--r) var(--r) 0 0; }
.ghead + .prow { border-top: 0; }
.results { max-height: 320px; overflow-y: auto; }
.results .ghead { padding: 10px 6px 4px; background: none; border: 0; }
.applybar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); }
.applybar.idle { background: var(--surface-2); border: 1px solid var(--line); }
.applybar span { flex: 1 1 200px; font-size: 14px; }
.btn:disabled { opacity: .45; cursor: default; filter: none; }
.catrow { display: flex; gap: 8px; align-items: center; }
.catrow .field { flex: 1; min-width: 0; }
.catlist { display: flex; flex-direction: column; gap: 8px; }
.ptable-wrap { overflow-x: auto; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); }
.ptable { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
.ptable th, .ptable td { padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: top; text-align: left; }
.ptable thead th { border-top: 0; font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; vertical-align: bottom; }
.ptable .pname { position: sticky; left: 0; z-index: 1; background: var(--surface); min-width: 120px; max-width: 160px; font-weight: 500; font-size: 14px; overflow-wrap: anywhere; box-shadow: 1px 0 0 var(--line); }
.ptable thead .pname { font-size: 12px; }
.ptable .gh td { padding: 0; background: var(--surface-2); }
.ptable .gh .ghead { position: sticky; left: 0; width: auto; min-width: min(100%, 320px); border-top: 0; }
.ptable td.best { background: var(--accent-soft); }
.ptable td.bad input { border-color: var(--warn); }
.pcell { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 6px; min-width: 124px; align-items: center; }
.pcell input, .pcell select { width: 100%; padding: 5px 6px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface-2); font-size: 13px; }
.pcell input { text-align: right; font-variant-numeric: tabular-nums; }
.pcell select { width: auto; padding: 4px 2px; }
.pcell input:focus, .pcell select:focus { border-color: var(--accent); outline: none; }
.pcell .u { font-size: 12px; color: var(--muted); }
.pcell .per { grid-column: 1 / -1; font-size: 11px; color: var(--muted); min-height: 1em; font-variant-numeric: tabular-nums; }
.ptable .num-col { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ptable td.num-col small { display: block; font-size: 11px; color: var(--muted); }
.applyrow { display: flex; justify-content: flex-end; align-items: center; gap: 8px; flex-wrap: wrap; }
.applyrow > span { font-size: 13px; color: var(--muted); }
.applyrow .err { margin-right: auto; }
.pxsec { display: flex; flex-direction: column; gap: 10px; }
.pxsec > div:not(.sechead-row) { display: flex; flex-direction: column; gap: 10px; }
.pxsec > div[hidden] { display: none; }
.sechead { display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 4px 0; font-family: var(--font-display); font-weight: 500; font-size: 16px; color: var(--ink); align-self: flex-start; }
.sechead .caret { font-size: 11px; color: var(--muted); transition: transform .15s ease; }
.sechead[aria-expanded="false"] .caret { transform: rotate(-90deg); }
.sechead-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.sectitle { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 16px; }
.ptable .sub { font-weight: 400; }
.ptable td.num-col.best { color: var(--ink); font-weight: 600; }
.costrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 14px; }
.costrow .costval { color: var(--muted); }
.costrow .costval b { color: var(--ink); font-variant-numeric: tabular-nums; }
.pxbar { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; }
.pxsort { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.pxsort .field { width: auto; padding: 6px 8px; }
.cost-line { margin: 0; font-size: 14px; color: var(--muted); }
.cost-line b { color: var(--ink); }
.toast { position: fixed; z-index: 15; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: max-content; max-width: calc(100% - 32px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 8px 24px rgba(0,0,0,.4); font-size: 14px; }
.toast span { min-width: 0; overflow-wrap: anywhere; }
.toast .btn { flex: none; color: var(--accent); }
.row-actions .push-right { margin-left: auto; }
.weektop { display: flex; flex-wrap: wrap; gap: 20px 32px; align-items: center; }
.donut { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 20px; flex: 1 1 300px; min-width: 0; }
.donut svg { width: 132px; height: 132px; flex: none; }
.donut .dc1 { font-family: var(--font-display); font-size: 13px; fill: var(--ink); }
.donut .dc2 { font-size: 9px; fill: var(--muted); }
.donut figcaption { flex: 1 1 160px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.legend { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.legend li { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; font-size: 14px; }
.legend .ln small { display: block; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.legend .ln small b { color: var(--ink); font-weight: 600; }
.legend .sw { width: 12px; height: 12px; border-radius: 3px; }
.sw.p { background: var(--prot); } .sw.f { background: var(--fat); } .sw.c { background: var(--carb); }
.legend .lp { text-align: right; color: var(--ink); }
.kcalavg { flex: 1 1 200px; display: flex; flex-direction: column; gap: 6px; }
.kcalavg .lbl { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.kcalavg .fine { margin: 0; }
.wchart { position: relative; }
.wplot { position: relative; height: 200px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; padding-top: 18px; border-bottom: 1px solid var(--line); }
.wbar { position: relative; display: flex; flex-direction: column; align-items: stretch; border: 0; background: none; padding: 0; min-width: 0; color: var(--muted); }
.wbar .wv { font-size: 11px; text-align: center; height: 16px; color: var(--muted); }
.wbar .wcol { flex: 1; display: flex; align-items: flex-end; justify-content: center; }
.wbar .wcol i { display: block; width: min(70%, 34px); background: var(--accent); border-radius: 4px 4px 0 0; }
.wbar .wcol i.over { background: var(--warn); }
.wbar .wd { position: absolute; bottom: -22px; left: 0; right: 0; text-align: center; font-size: 12px; }
.wbar.today .wd { color: var(--ink); font-weight: 600; }
.wbar:hover .wcol i, .wbar:focus-visible .wcol i { filter: brightness(1.2); }
.wgoal { position: absolute; left: 0; right: 0; border-top: 1.5px dashed var(--muted); pointer-events: none; z-index: 1; }
.wgoal span { position: absolute; right: 0; top: -17px; font-size: 11px; color: var(--muted); background: var(--surface); padding-left: 4px; }
.wtip { position: absolute; z-index: 3; top: 0; transform: translateX(-50%); background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12px; white-space: nowrap; box-shadow: 0 6px 16px rgba(0,0,0,.4); pointer-events: none; }
.wtable-wrap { overflow-x: auto; margin-top: 30px; }
.wtable { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.wtable th, .wtable td { padding: 7px 8px; text-align: right; border-top: 1px solid var(--line); }
.wtable th:first-child { text-align: left; font-weight: 400; }
.wtable thead th { border-top: 0; font-size: 12px; color: var(--muted); font-weight: 600; }
.wtable tr.today th .linkbtn { font-weight: 600; }
.wtable td.muted { color: var(--muted); text-align: left; font-size: 13px; }
.wtable tfoot th, .wtable tfoot td { font-weight: 600; border-top: 2px solid var(--line); }
.mlist { display: flex; flex-direction: column; gap: 10px; }
.mcard { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.mcard > .ghead:first-child { border-top: 0; }
.mpad { padding: 12px 14px; }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 10px; padding: 10px 12px 10px 14px; border-top: 1px solid var(--line); align-items: start; }
.mcard > .mrow:first-child, .ghead + .mrow { border-top: 0; }
.mrow .mname { font-weight: 500; font-size: 14px; overflow-wrap: anywhere; padding-top: 6px; }
.mrow [data-pxcell] { padding: 4px; border-radius: 8px; }
.mrow [data-pxcell].best { background: var(--accent-soft); }
.mrow [data-pxcell].bad input { border-color: var(--warn); }
.mrow .pcell { min-width: 0; }
.mlist > .ghead { border-radius: 10px; border-top: 0; }
.mcmp { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.mcmp h3 { margin: 0; font-size: 15px; font-weight: 500; overflow-wrap: anywhere; }
.mcmp ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.mcmp li { display: flex; justify-content: space-between; gap: 10px; padding: 6px 8px; border-radius: 8px; font-size: 14px; }
.mcmp li.best { background: var(--accent-soft); font-weight: 600; }
.mcmp li small { color: var(--muted); font-weight: 400; font-size: 12px; }
.meval { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.meval span { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.meval b { color: var(--ink); font-weight: 600; font-size: 14px; white-space: nowrap; }
.shopchips { margin-bottom: 2px; }
.encard .enhead { display: flex; flex-direction: column; gap: 6px; }
.enbar { display: flex; gap: 2px; height: 12px; border-radius: 6px; overflow: hidden; background: var(--surface-2); }
.enbar i { display: block; height: 100%; }
.enbar .pl, .enlegend .sw.pl { background: var(--accent); }
.enbar .ex, .enlegend .sw.ex { background: color-mix(in srgb, var(--accent) 45%, var(--surface)); }
.enlegend .sw.ov { background: var(--warn); }
.enlegend { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.enlegend li { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.enlegend .sw { width: 12px; height: 12px; border-radius: 3px; }
.enlegend b { font-weight: 600; white-space: nowrap; }

/* ---------- storage ---------- */
function makeLocalStore() {
  const get = k => { try { return JSON.parse(localStorage.getItem('kbju.' + k)); } catch (e) { return null; } };
  const put = (k, v) => { try { localStorage.setItem('kbju.' + k, JSON.stringify(v)); } catch (e) {} };
  let listener = null;
  const emit = () => listener && listener(get('products') || {});
  return {
    kind: 'local',
    async getProfile() { return get('profile'); },
    async saveProfile(p) { put('profile', p); },
    async getCats() { return get('cats'); },
    async getPrices() { return get('prices'); },
    async savePrices(p) { put('prices', p); },
    async saveCats(c) { put('cats', c); },
    async getProducts() { return get('products') || {}; },
    subscribeProducts(cb) { listener = cb; emit(); return () => { listener = null; }; },
    async saveProduct(p) { const all = get('products') || {}; all[p.id] = p; put('products', all); emit(); },
    async deleteProduct(id) { const all = get('products') || {}; delete all[id]; put('products', all); emit(); },
    async getDay(d) { return get('day.' + d); },
    async saveDay(d, data) { put('day.' + d, data); },
    async allDays() {
      const out = {};
      try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith('kbju.day.')) out[k.slice(9)] = get(k.slice(5)); } } catch (e) {}
      return out;
    },
  };
}

/* ---------- save status ---------- */
function setStatus(kind) {
  const el = $('#status');
  if (!el) return;
  el.classList.toggle('err', kind === 'error');
  el.textContent = kind === 'saving' ? 'Сохраняю…' : kind === 'saved' ? 'Сохранено' : kind === 'error' ? 'Не удалось сохранить, проверьте связь' : '';
}

let dayTimer = null, dayDirty = false, chain = Promise.resolve();
function touchDay() { dayDirty = true; setStatus('saving'); clearTimeout(dayTimer); dayTimer = setTimeout(flushDay, 500); }
function flushDay() {
  clearTimeout(dayTimer);
  if (!dayDirty) return chain;
  dayDirty = false;
  const date = S.date, data = clone(S.day);
  chain = chain.then(() => S.store.saveDay(date, data)).then(() => setStatus('saved'), () => setStatus('error'));
  return chain;
}
let profTimer = null;
function touchProfile() {
  setStatus('saving'); clearTimeout(profTimer);
  profTimer = setTimeout(() => { const p = clone(S.profile); chain = chain.then(() => S.store.saveProfile(p)).then(() => setStatus('saved'), () => setStatus('error')); }, 600);
}
async function run(promise) {
  setStatus('saving');
  try { await promise; setStatus('saved'); return true; } catch (e) { setStatus('error'); return false; }
}

async function loadDay(date) {
  await flushDay();
  S.date = date;
  let d = null;
  try { d = await S.store.getDay(date); } catch (e) {}
  if (S.date !== date) return;
  S.day = d && Array.isArray(d.meals) ? d : defaultDay();
}

/* ---------- math ---------- */
function itemTotals(it) { const k = (num(it.grams) || 0) / 100; return { kcal: it.kcal * k, p: it.p * k, f: it.f * k, c: it.c * k }; }
function sum(items) { return items.reduce((a, it) => { const t = itemTotals(it); a.kcal += t.kcal; a.p += t.p; a.f += t.f; a.c += t.c; return a; }, { kcal: 0, p: 0, f: 0, c: 0 }); }
function dayTotals() { return sum(S.day.meals.flatMap(m => m.items)); }

function computeGoal(pr) {
  const age = num(pr.age), h = num(pr.height), w = num(pr.weight);
  if (pr.manual) {
    const k = num(pr.mKcal);
    if (!(k > 0)) return null;
    return { kcal: k, p: num(pr.mP) || 0, f: num(pr.mF) || 0, c: num(pr.mC) || 0, manual: true };
  }
  if (!(age > 0 && h > 0 && w > 0)) return null;
  const bmr = 10 * w + 6.25 * h - 5 * age + (pr.sex === 'f' ? -161 : 5);
  const tdee = bmr * (num(pr.activity) || 1.2);
  const factor = pr.goal === 'lose' ? 0.85 : pr.goal === 'gain' ? 1.1 : 1;
  const kcal = Math.round(tdee * factor / 10) * 10;
  const p = Math.round(w * (pr.goal === 'keep' ? 1.5 : 1.8));
  const f = Math.round(w * 0.9);
  const c = Math.max(0, Math.round((kcal - p * 4 - f * 9) / 4));
  return { kcal, p, f, c, bmr, tdee };
}

/* ---------- rendering ---------- */
const view = () => $('#view');

function render() {
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === S.tab)));
  const gear = $('#gearbtn'); if (gear) gear.setAttribute('aria-pressed', String(S.tab === 'profile'));
  if (S.tab !== 'diary') S.ui.adding = null;
  view().innerHTML = (S.tab === 'products' ? productsHTML() : S.tab === 'prices' ? pricesHTML() : S.tab === 'week' ? weekHTML() : S.tab === 'profile' ? profileHTML() : diaryHTML());
  renderSheet();
  renderModal();
}

function dayLabel() {
  const d = parseDate(S.date), today = new Date();
  const t0 = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const diff = Math.round((d - t0) / 86400000);
  const rel = diff === 0 ? 'Сегодня' : diff === -1 ? 'Вчера' : diff === 1 ? 'Завтра' : '';
  const full = d.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
  return { rel, full, isToday: diff === 0 };
}

function diaryHTML() {
  const L = dayLabel();
  const meals = S.day.meals.map((m, i) => mealHTML(m, i) + `<div class="snack-gap"><button data-act="addSnack" data-pos="${i + 1}">+ перекус</button></div>`).join('');
  return `
  <section class="daybar">
    <button class="iconbtn" data-act="prevDay" aria-label="Предыдущий день">‹</button>
    <div class="dayname"><b>${esc(L.rel || L.full)}</b><span>${L.rel ? esc(L.full) : ''}${L.isToday ? '' : ` <button class="todaybtn" data-act="today">к сегодня</button>`}</span></div>
    <button class="iconbtn" data-act="nextDay" aria-label="Следующий день">›</button>
  </section>
  <section class="summary" id="summary">${summaryHTML()}</section>
  <section class="meals">${meals}</section>`;
}

function summaryHTML() {
  const t = dayTotals(), g = computeGoal(S.profile);
  if (!g) {
    return `<div class="sum-top"><div class="kcal-big num">${r0(t.kcal)}<small>ккал</small></div></div>
      <div class="macros">${macroHTML('p', 'Белки', t.p)}${macroHTML('f', 'Жиры', t.f)}${macroHTML('c', 'Углеводы', t.c)}</div>
      <p class="goalhint">Заполните <button class="linkbtn" data-act="tab" data-tab="profile">параметры</button>, и здесь появится ваша норма на день.</p>${dayCostHTML()}`;
  }
  const left = g.kcal - t.kcal, over = left < 0;
  return `<div class="sum-top">
      <div class="kcal-big num">${r0(t.kcal)}<small>из ${r0(g.kcal)} ккал</small></div>
      <div class="left ${over ? 'over' : ''}">${over ? 'Сверх нормы' : 'Осталось'} <b class="num">${r0(Math.abs(left))}</b> ккал</div>
    </div>
    <div class="bar ${over ? 'over' : ''}"><i style="width:${Math.min(100, t.kcal / g.kcal * 100)}%"></i></div>
    <div class="macros">${macroHTML('p', 'Белки', t.p, g.p)}${macroHTML('f', 'Жиры', t.f, g.f)}${macroHTML('c', 'Углеводы', t.c, g.c)}</div>${dayCostHTML()}`;
}
function macroHTML(cls, label, v, goal) {
  if (!goal) return `<div class="macro ${cls}"><span class="lbl">${label}</span><span class="val num"><b>${r0(v)}</b> г</span></div>`;
  const over = v > goal * 1.05;
  return `<div class="macro ${cls}"><span class="lbl">${label}</span><span class="val num"><b>${r0(v)}</b> / ${r0(goal)} г</span>
    <div class="bar ${over ? 'over' : ''}"><i style="width:${Math.min(100, v / goal * 100)}%"></i></div></div>`;
}

function mealSumHTML(m) {
  const t = sum(m.items);
  return m.items.length ? `<b class="num">${r0(t.kcal)}</b> ккал <span class="num macs">${dots(t)}</span>` : '';
}

function pcsText(it) { return it.piece ? `≈ ${r1((num(it.grams) || 0) / it.piece)} шт` : ''; }

function mealHTML(m, idx) {
  const snack = m.type === 'snack';
  const n = S.day.meals.length;
  const items = m.items.length
    ? `<ul class="items">${m.items.map(it => {
        const t = itemTotals(it);
        return `<li class="item">
          <div class="iname"><div>${esc(it.name)}</div><small class="num" data-imac="${it.id}">Б ${r1(t.p)} · Ж ${r1(t.f)} · У ${r1(t.c)}</small></div>
          <label class="qty"><input type="number" inputmode="decimal" min="0" step="1" id="g-${it.id}" value="${esc(it.grams)}" data-grams="${it.id}" data-meal="${m.id}" aria-label="Граммы: ${esc(it.name)}"> г${it.piece ? `<span class="pcs" data-ipcs="${it.id}">${pcsText(it)}</span>` : ''}</label>
          <span class="ikcal" data-ikcal="${it.id}">${r0(t.kcal)}<small>ккал</small></span>
          <button class="del" data-act="delItem" data-meal="${m.id}" data-item="${it.id}" aria-label="Убрать ${esc(it.name)}">×</button>
        </li>`; }).join('')}</ul>`
    : `<p class="empty">${snack ? 'Перекус пока пустой.' : 'Пока ничего не добавлено.'}</p>`;
  const tools = snack ? `<div class="snack-tools">
      <button class="mini" data-act="moveUp" data-meal="${m.id}" ${idx === 0 ? 'disabled' : ''} aria-label="Выше">↑</button>
      <button class="mini" data-act="moveDown" data-meal="${m.id}" ${idx === n - 1 ? 'disabled' : ''} aria-label="Ниже">↓</button>
      <button class="mini" data-act="delSnack" data-meal="${m.id}" aria-label="Удалить перекус">✕</button></div>` : '';
  const confirm = S.ui.confirmDel === m.id ? `<div class="confirm"><span>Удалить перекус вместе с продуктами (${m.items.length})?</span>
      <button class="btn sm danger" data-act="delSnackYes" data-meal="${m.id}">Удалить</button><button class="btn sm" data-act="cancelConfirm">Отмена</button></div>` : '';
  const add = `<button class="addbtn" data-act="openAdd" data-meal="${m.id}">+ продукт</button>`;
  const closed = S.ui.mealsClosed.has(m.id);
  return `<article class="meal ${snack ? 'snack' : ''} ${closed ? 'closed' : ''}" data-mealcard="${m.id}">
    <div class="meal-head">
      ${snack ? `<span class="handle" draggable="true" data-handle="${m.id}" title="Перетащите, чтобы переместить" aria-hidden="true">⋮⋮</span>` : ''}
      <button class="mealtoggle" data-act="toggleMeal" data-meal="${m.id}" aria-expanded="${!closed}"><span class="caret" aria-hidden="true">▼</span><h3>${MEAL_NAMES[m.type]}</h3>${closed && m.items.length ? `<span class="mcount">${m.items.length}</span>` : ''}</button>
      <span class="meal-sum" data-mealsum="${m.id}">${mealSumHTML(m)}</span>
      ${tools}
    </div>
    ${closed ? '' : confirm + items + add}
  </article>`;
}

/* ---------- prices ---------- */
const fmtDay = iso => { try { return parseDate(iso).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }); } catch (e) { return ''; } };
const nf2 = new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const rub = n => n == null ? '—' : (n >= 100 ? nf0.format(Math.round(n)) : n >= 10 ? nf1.format(Math.round(n * 10) / 10) : nf2.format(Math.round(n * 100) / 100)) + ' ₽';
const nv = v => { const s = String(v ?? '').trim(); return s === '' ? '' : num(s); };

function cellGrams(c, prod) {
  const q = num(c && c.qty);
  if (!(q > 0)) return 0;
  return c.unit === 'pc' ? (prod && prod.piece ? q * prod.piece : 0) : q;
}
function per100(c, prod) { const pr = num(c && c.price), g = cellGrams(c, prod); return pr > 0 && g > 0 ? pr / g * 100 : null; }
/* "Sold in one shop only": the saved value lives on the product; unapplied changes wait in S.pxOnly. */
const shopExists = id => !!id && S.prices.shops.some(s => s.id === id);
const savedOnly = pid => { const o = S.products[pid] && S.products[pid].onlyShop; return shopExists(o) ? o : ''; };
const draftOnly = pid => pid in S.pxOnly ? (shopExists(S.pxOnly[pid]) ? S.pxOnly[pid] : '') : savedOnly(pid);
const shopAllowed = (pid, sid, draft) => { const o = draft ? draftOnly(pid) : savedOnly(pid); return !o || o === sid; };
function bestPrice(pid, table) {
  const draft = !!table && table === S.pxDraft;
  const row = (table || S.prices.prices)[pid] || {}; let best = null, n = 0;
  for (const sh of S.prices.shops) { if (!shopAllowed(pid, sh.id, draft)) continue; const v = per100(row[sh.id], S.products[pid]); if (v != null) { n++; if (!best || v < best.v) best = { v, shop: sh.id }; } }
  if (best) best.n = n;
  return best;
}
const protCost = (best, prod) => best && prod && prod.p > 0 ? best.v / prod.p * 10 : null;
const kcalCost = (best, prod) => best && prod && prod.kcal > 0 ? best.v / prod.kcal * 100 : null;
/* Price of one piece: counted in pieces → price / pieces; product with a piece weight → from the 100 g price; otherwise the whole package. */
function unitPrice(c, p) {
  const pr = num(c && c.price), q = num(c && c.qty);
  if (!(pr > 0) || !(q > 0)) return null;
  if (c.unit === 'pc' && p.piece) return { v: pr / q, note: '' };
  if (p.piece) return { v: per100(c, p) * p.piece / 100, note: '' };
  return { v: pr, note: 'за ' + nf0.format(q) + ' г' };
}

function pxDirty() {
  if (!S.pxDraft) return false;
  const a = S.pxDraft, b = S.prices.prices;
  const key = c => { if (!c) return ''; const p = nv(c.price), q = nv(c.qty); return p === '' && q === '' ? '' : JSON.stringify([p, q, c.unit === 'pc' ? 'pc' : 'g']); };
  for (const pid of Object.keys(S.pxOnly)) if (draftOnly(pid) !== savedOnly(pid)) return true;
  for (const pid of new Set([...Object.keys(a), ...Object.keys(b)]))
    for (const sh of S.prices.shops) if (key(shopAllowed(pid, sh.id, true) ? (a[pid] || {})[sh.id] : null) !== key((b[pid] || {})[sh.id])) return true;
  return false;
}
function pxApplyHTML() {
  const d = pxDirty();
  return `${S.ui.pxErr ? `<span class="err">${esc(S.ui.pxErr)}</span>` : d ? '<span>Есть неприменённые изменения</span>' : ''}
    ${d ? '<button class="btn" data-act="pxCancel">Отменить</button>' : ''}
    <button class="btn primary" data-act="pxApply" ${d ? '' : 'disabled'}>Применить</button>`;
}

let pxEntryOpen = false;

  const top = `<div class="toolbar">
      <input class="field" id="px-search" type="search" placeholder="Поиск по продуктам" value="${esc(S.ui.pxQuery)}" autocomplete="off">

  if (!S.prices.shops.length) return top + `<section class="card"><p class="fine">Добавьте магазины, в которых покупаете продукты. Каждый магазин станет столбцом таблицы.</p>
    <div class="row-actions"><button class="btn primary" data-act="manageShops">Добавить магазин</button></div></section>`;
  return top + `
    <section class="pxsec">
      <button class="sechead" data-act="pxEntryToggle" aria-expanded="${pxEntryOpen}"><span class="caret" aria-hidden="true">▼</span>Ввод цен</button>
      <div id="px-entry" ${pxEntryOpen ? '' : 'hidden'}>
        <p class="label-note">Цену вводите как на ценнике: сколько стоит упаковка и сколько в ней граммов (у продуктов с весом штуки можно указать штуки).</p>
        ${narrowPx() ? `<div class="mlist" id="ptable">${ptableHTML()}</div>` : `<div class="ptable-wrap"><table class="ptable" id="ptable">${ptableHTML()}</table></div>`}
        <div class="applyrow" id="px-apply">${pxApplyHTML()}</div>
      </div>
    </section>
    <section class="pxsec">
      <div class="sechead-row"><h2 class="sectitle">Сравнение</h2>
        <label class="pxsort">Сортировка
          <select class="field" id="px-sort">
            <option value="name" ${S.ui.pxSort === 'name' ? 'selected' : ''}>по названию</option>
            <option value="price" ${S.ui.pxSort === 'price' ? 'selected' : ''}>по цене за 100 г</option>
            <option value="kcal" ${S.ui.pxSort === 'kcal' ? 'selected' : ''}>по цене 100 ккал</option>
            <option value="prot" ${S.ui.pxSort === 'prot' ? 'selected' : ''}>по цене белка</option>
          </select></label>
      </div>
      ${narrowPx() ? `<div class="mlist" id="cmptable">${cmpTableHTML()}</div>` : `<div class="ptable-wrap"><table class="ptable" id="cmptable">${cmpTableHTML()}</table></div>`}
      <p class="label-note">У магазинов — цена за 1 штуку (если у продукта не задан вес штуки, то за упаковку). Дальше оценка по лучшей цене: сколько стоят 100 г, 100 ккал и 10 г белка. Зелёным отмечен магазин, где выгоднее всего в пересчёте на вес. Здесь видны только применённые цены.</p>
    </section>`;
}

/* Phones get lists and cards instead of wide tables. */
const PX_NARROW = '(max-width: 640px)';
const narrowPx = () => { try { return matchMedia(PX_NARROW).matches; } catch (e) { return false; } };
function pxShopSel() { if (!S.prices.shops.some(s => s.id === S.ui.pxShop)) S.ui.pxShop = S.prices.shops[0] ? S.prices.shops[0].id : null; return S.ui.pxShop; }

function pxCellHTML(p, sh, tag) {
  if (!shopAllowed(p.id, sh.id, true)) return `<${tag} class="na" data-pxcell="${esc(p.id + '__' + sh.id)}"></${tag}>`;
  const row = S.pxDraft[p.id] || {}, saved = S.prices.prices[p.id] || {};
  const best = bestPrice(p.id, S.pxDraft);
  const c = row[sh.id] || {}, id = p.id + '__' + sh.id, unit = p.piece && c.unit !== 'g' ? 'pc' : 'g'; // pieces first for products with a piece weight
  const cls = [best && best.n > 1 && best.shop === sh.id ? 'best' : '', S.ui.pxBad.has(id) ? 'bad' : ''].join(' ');
  return `<${tag} class="${cls}" data-pxcell="${esc(id)}"><div class="pcell">
      <input id="pxp-${esc(id)}" data-px="price" data-pid="${esc(p.id)}" data-sid="${esc(sh.id)}" type="number" inputmode="decimal" min="0" step="any" value="${esc(c.price ?? '')}" placeholder="цена" aria-label="Цена: ${esc(p.name)}, ${esc(sh.name)}"><span class="u">₽</span>
      <input id="pxq-${esc(id)}" data-px="qty" data-pid="${esc(p.id)}" data-sid="${esc(sh.id)}" type="number" inputmode="decimal" min="0" step="any" value="${esc(c.qty ?? (unit === 'pc' ? '1' : ''))}" placeholder="${unit === 'pc' ? 'шт' : 'вес'}" aria-label="Вес или количество в упаковке">
      ${p.piece ? `<select id="pxu-${esc(id)}" data-px="unit" data-pid="${esc(p.id)}" data-sid="${esc(sh.id)}" aria-label="Единица"><option value="pc" ${unit === 'pc' ? 'selected' : ''}>шт</option><option value="g" ${unit === 'g' ? 'selected' : ''}>г</option></select>` : '<span class="u">г</span>'}
      <span class="per" data-pxper="${esc(id)}">${pxPerText(c, p, saved[sh.id])}</span>
    </div></${tag}>`;
}

function ptableHTML() {
  const shops = S.prices.shops, all = S.ui.pxCat === 'all';
  const groups = productGroups(S.ui.pxQuery, S.ui.pxCat).map(g => ({ ...g, items: g.items.filter(p => !p.recipe) })).filter(g => g.items.length);
  const emptyMsg = Object.keys(S.products).length ? 'Ничего не нашлось.' : 'В базе пока нет продуктов.';
  if (narrowPx()) {
    const sh = shops.find(s => s.id === pxShopSel());
    const groupsHere = groups.map(g => ({ ...g, items: g.items.filter(p => shopAllowed(p.id, sh.id, true)) })).filter(g => g.items.length);
    const chips = `<div class="chips shopchips" role="group" aria-label="Магазин">${shops.map(s => `<button class="chip" data-act="pxShop" data-sid="${esc(s.id)}" aria-pressed="${s.id === sh.id}">${esc(s.name)}</button>`).join('')}</div>`;
    if (!groupsHere.length) return chips + `<div class="mcard"><p class="empty mpad">${groups.length ? 'В этом магазине нет подходящих продуктов.' : emptyMsg}</p></div>`;
    const body = groupsHere.map(g => (all ? groupHead(g, S.ui.pxQuery) : '') + (all && isCollapsed(g.id, S.ui.pxQuery) ? '' :
      g.items.map(p => `<div class="mrow" data-pxrow="${esc(p.id)}"><div class="mname">${esc(p.name)}</div>${pxCellHTML(p, sh, 'div')}</div>`).join(''))).join('');
    return chips + `<div class="mcard">${body}</div>`;
  }
  const cols = shops.length + 1;
  const head = `<thead><tr><th class="pname" scope="col">Продукт</th>${shops.map(s => `<th scope="col">${esc(s.name)}</th>`).join('')}</tr></thead>`;
  if (!groups.length) return head + `<tbody><tr><td class="pname" colspan="${cols}">${emptyMsg}</td></tr></tbody>`;
  const body = groups.map(g => (all ? `<tr class="gh"><td colspan="${cols}">${groupHead(g, S.ui.pxQuery)}</td></tr>` : '') +
    (all && isCollapsed(g.id, S.ui.pxQuery) ? '' : g.items.map(pxRowHTML).join(''))).join('');
  return head + `<tbody>${body}</tbody>`;
}

function pxRowHTML(p) {
  return `<tr data-pxrow="${esc(p.id)}"><th class="pname" scope="row">${esc(p.name)}</th>${S.prices.shops.map(sh => pxCellHTML(p, sh, 'td')).join('')}</tr>`;
}

function cmpTableHTML() {
  const shops = S.prices.shops, all = S.ui.pxCat === 'all';
  const sortKey = p => { const b = bestPrice(p.id); return S.ui.pxSort === 'prot' ? protCost(b, p) : S.ui.pxSort === 'kcal' ? kcalCost(b, p) : b ? b.v : null; };
  const groups = productGroups(S.ui.pxQuery, S.ui.pxCat)
    .map(g => ({ ...g, items: g.items.filter(p => bestPrice(p.id)) }))
    .filter(g => g.items.length);
  if (S.ui.pxSort !== 'name') groups.forEach(g => g.items.sort((a, b) => { const x = sortKey(a), y = sortKey(b); return x == null && y == null ? alpha(a, b) : x == null ? 1 : y == null ? -1 : x - y; }));
  const emptyMsg = Object.keys(S.prices.prices).length ? 'Ничего не нашлось.' : 'Пока нет цен. Заполните «Ввод цен» и нажмите «Применить».';

  if (narrowPx()) {
    if (!groups.length) return `<div class="mcard"><p class="empty mpad">${emptyMsg}</p></div>`;
    const card = p => {
      const best = bestPrice(p.id), r = S.prices.prices[p.id] || {};
      const lines = shops.map(sh => ({ sh, u: unitPrice(r[sh.id], p) })).filter(x => x.u).map(({ sh, u }) =>
        `<li class="${best.n > 1 && best.shop === sh.id ? 'best' : ''}"><span>${esc(sh.name)}</span><span class="num">${rub(u.v)} <small>${u.note || 'за шт'}</small></span></li>`).join('');
      return `<article class="mcmp"><h3>${esc(p.name)}</h3><ul>${lines}</ul>
        <div class="meval num"><span>100 г<b>${rub(best.v)}</b></span><span>100 ккал<b>${rub(kcalCost(best, p))}</b></span><span>10 г белка<b>${rub(protCost(best, p))}</b></span></div></article>`;
    };
    return groups.map(g => (all ? groupHead(g, S.ui.pxQuery) : '') + (all && isCollapsed(g.id, S.ui.pxQuery) ? '' : g.items.map(card).join(''))).join('');
  }

  const cols = shops.length + 4;
  const head = `<thead><tr><th class="pname" scope="col">Продукт</th>${shops.map(s => `<th scope="col" class="num-col">${esc(s.name)}<br><span class="sub">за 1 шт</span></th>`).join('')}<th scope="col" class="num-col">Лучшая<br><span class="sub">за 100 г</span></th><th scope="col" class="num-col">100<br><span class="sub">ккал</span></th><th scope="col" class="num-col">10 г<br><span class="sub">белка</span></th></tr></thead>`;
  if (!groups.length) return head + `<tbody><tr><td class="pname" colspan="${cols}">${emptyMsg}</td></tr></tbody>`;
  const row = p => {
    const best = bestPrice(p.id), r = S.prices.prices[p.id] || {};
    const cells = shops.map(sh => { if (!shopAllowed(p.id, sh.id)) return '<td class="num-col"></td>'; const u = unitPrice(r[sh.id], p); return `<td class="num-col ${u && best.n > 1 && best.shop === sh.id ? 'best' : ''}">${u ? rub(u.v) + (u.note ? `<small>${u.note}</small>` : '') : '—'}</td>`; }).join('');
    return `<tr><th class="pname" scope="row">${esc(p.name)}</th>${cells}<td class="num-col">${pxBestText(best)}</td><td class="num-col">${rub(kcalCost(best, p))}</td><td class="num-col">${rub(protCost(best, p))}</td></tr>`;
  };
  const body = groups.map(g => (all ? `<tr class="gh"><td colspan="${cols}">${groupHead(g, S.ui.pxQuery)}</td></tr>` : '') +
    (all && isCollapsed(g.id, S.ui.pxQuery) ? '' : g.items.map(row).join(''))).join('');
  return head + `<tbody>${body}</tbody>`;
}
try { matchMedia(PX_NARROW).addEventListener('change', () => { if (S.tab === 'prices') render(); }); } catch (e) {}

function rerenderPx() { if ($('#ptable')) $('#ptable').innerHTML = ptableHTML(); if ($('#cmptable')) $('#cmptable').innerHTML = cmpTableHTML(); }

function pxPerText(c, p, saved) { const v = per100(c, p); return (v != null ? rub(v) + ' / 100 г' : '') + (saved && saved.date && v != null ? ' · ' + fmtDay(saved.date) : ''); }
function pxBestText(best) { if (!best) return '—'; const sh = S.prices.shops.find(s => s.id === best.shop); return `<b>${rub(best.v)}</b>${S.prices.shops.length > 1 && sh ? `<small>${esc(sh.name)}</small>` : ''}`; }

function refreshPxRow(pid) {
  const p = S.products[pid]; if (!p) return;
  const best = bestPrice(pid, S.pxDraft), row = S.pxDraft[pid] || {}, saved = S.prices.prices[pid] || {};
  for (const sh of S.prices.shops) {
    const id = pid + '__' + sh.id;
    const td = document.querySelector(`[data-pxcell="${CSS.escape(id)}"]`); if (!td) continue;
    td.classList.toggle('best', !!best && best.n > 1 && best.shop === sh.id);
    const per = td.querySelector('.per'); if (per) per.textContent = pxPerText(row[sh.id], p, saved[sh.id]);
  }
  const b = document.querySelector(`[data-pxbest="${CSS.escape(pid)}"]`); if (b) b.innerHTML = pxBestText(best);
  const pr = document.querySelector(`[data-pxprot="${CSS.escape(pid)}"]`); if (pr) pr.textContent = rub(protCost(best, p));
}

function pxEdit(t) {
  const { pid, sid } = t.dataset;
  const row = S.pxDraft[pid] || (S.pxDraft[pid] = {});
  const pc = S.products[pid] && S.products[pid].piece;
  const c = row[sid] || (row[sid] = pc ? { unit: 'pc', qty: '1' } : { unit: 'g' });
  c[t.dataset.px] = t.value;
  if (t.dataset.px === 'unit' && t.value === 'g' && c.qty === '1') { c.qty = ''; const q0 = document.getElementById('pxq-' + pid + '__' + sid); if (q0) q0.value = ''; }
  if (t.dataset.px === 'unit') { const q = document.getElementById('pxq-' + pid + '__' + sid); if (q) q.placeholder = t.value === 'pc' ? 'шт' : 'вес'; }
  S.ui.pxBad.delete(pid + '__' + sid);
  t.closest('td')?.classList.remove('bad');
  if (S.ui.pxErr && !S.ui.pxBad.size) S.ui.pxErr = '';
  refreshPxRow(pid);
  $('#px-apply').innerHTML = pxApplyHTML();
}

function applyPrices() {
  const out = {}, bad = new Set(), t = isoDate(new Date());
  for (const [pid, row] of Object.entries(S.pxDraft)) for (const sh of S.prices.shops) {
    const c = row[sh.id]; if (!c || !shopAllowed(pid, sh.id, true)) continue;
    const p = nv(c.price), q = nv(c.qty);
    if (p === '' && q === '') continue;
    if (!(p > 0) || !(q > 0)) { bad.add(pid + '__' + sh.id); continue; }
    const unit = S.products[pid] && S.products[pid].piece && c.unit !== 'g' ? 'pc' : 'g';
    const old = (S.prices.prices[pid] || {})[sh.id];
    const same = old && old.price === p && old.qty === q && (old.unit || 'g') === unit;
    (out[pid] || (out[pid] = {}))[sh.id] = { price: p, qty: q, unit, date: same ? old.date : t };
  }
  /* keep prices of products hidden by the current filter or deleted shops' cleanup */
  for (const [pid, row] of Object.entries(S.prices.prices)) if (!S.pxDraft[pid]) out[pid] = row;
  if (bad.size) {
    S.ui.pxBad = bad;
    S.ui.pxErr = bad.size === 1 ? 'В одной ячейке не хватает цены или количества (нужны оба числа больше нуля).' : `В ${bad.size} ячейках не хватает цены или количества (нужны оба числа больше нуля).`;
    $('#ptable').innerHTML = ptableHTML(); $('#px-apply').innerHTML = pxApplyHTML();
    return;
  }
  for (const pid of Object.keys(S.pxOnly)) {
    const prod = S.products[pid], o = draftOnly(pid);
    if (prod && o !== savedOnly(pid)) { const np = { ...prod, onlyShop: o }; S.products[pid] = np; run(S.store.saveProduct(np)); }
  }
  S.pxOnly = {};
  S.prices.prices = out; S.pxDraft = clone(out); S.ui.pxErr = ''; S.ui.pxBad = new Set();
  savePrices(); render();
}
function savePrices() { return run(S.store.savePrices(clone(S.prices))); }

/* ---------- week summary (Monday to Sunday) ---------- */
const WD = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
function mondayOf(iso) { const d = parseDate(iso); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return isoDate(d); }
function addDays(iso, n) { const d = parseDate(iso); d.setDate(d.getDate() + n); return isoDate(d); }

async function loadWeek() {
  const mon = S.week;
  if (S.weekLoading === mon) return;
  S.weekLoading = mon;
  await flushDay();
  const dates = [...Array(7)].map((_, i) => addDays(mon, i));
  const days = await Promise.all(dates.map(d => d === S.date ? Promise.resolve(clone(S.day)) : S.store.getDay(d).catch(() => null)));
  S.weekLoading = null;
  if (S.week !== mon) return;
  S.weekData = { mon, rows: dates.map((date, i) => {
    const items = days[i] && Array.isArray(days[i].meals) ? days[i].meals.flatMap(m => m.items) : [];
    return { date, n: items.length, ...sum(items) };
  }) };
  if (S.tab === 'week') render();
}

function weekLabel(mon) {
  const a = parseDate(mon), b = parseDate(addDays(mon, 6));
  const m = d => d.toLocaleDateString('ru-RU', { month: 'long' }).replace(/ь$/, 'я').replace(/й$/, 'я').replace(/т$/, 'та');
  const fmt = d => d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
  return a.getMonth() === b.getMonth() ? `${a.getDate()} – ${fmt(b)}` : `${fmt(a)} – ${fmt(b)}`;
}

function weekHTML() {
  const thisMon = mondayOf(isoDate(new Date()));
  if (!S.week) S.week = thisMon;
  const bar = `<section class="daybar">
    <button class="iconbtn" data-act="prevWeek" aria-label="Предыдущая неделя">‹</button>
    <div class="dayname"><b>${S.week === thisMon ? 'Эта неделя' : S.week === addDays(thisMon, -7) ? 'Прошлая неделя' : 'Неделя'}</b><span>${esc(weekLabel(S.week))}${S.week === thisMon ? '' : ' <button class="todaybtn" data-act="thisWeek">к этой неделе</button>'}</span></div>
    <button class="iconbtn" data-act="nextWeek" aria-label="Следующая неделя">›</button>
  </section>`;
  if (!S.weekData || S.weekData.mon !== S.week) { loadWeek(); return bar + '<div class="loading">Считаю неделю…</div>'; }

  const rows = S.weekData.rows, filled = rows.filter(r => r.n > 0), n = filled.length;
  if (!n) return bar + `<section class="card"><p class="fine">За эту неделю записей нет. Сводка появится, как только в дневнике будет хотя бы один день с едой.</p></section>`;
  const avg = k => filled.reduce((a, r) => a + r[k], 0) / n;
  const A = { kcal: avg('kcal'), p: avg('p'), f: avg('f'), c: avg('c') };
  const g = computeGoal(S.profile), E = energyCalc();
  const ev = r => { const v = E.dayVal(r); return `<td class="${v < 0 && E.mode !== 'keep' ? 'neg' : ''}">${E.mode === 'keep' ? signed(v) : r0(v)}</td>`; };
  return bar + `
  <section class="card weekcard">
    <div class="weektop">
      ${donutHTML(A, g)}
      <div class="kcalavg">
        <span class="lbl">В среднем за день</span>
        <div class="kcal-big num">${r0(A.kcal)}<small>ккал</small></div>
        ${g ? `<p class="fine num">Норма ${r0(g.kcal)} ккал · ${A.kcal > g.kcal ? 'больше на' : 'меньше на'} <b>${r0(Math.abs(A.kcal - g.kcal))}</b></p>` : ''}
        <p class="fine">Среднее по ${n} ${n === 1 ? 'дню' : 'дням'} с записями из 7. Пустые дни не учитываются.</p>
      </div>
    </div>
  </section>
  ${energyHTML(filled, E)}
  <section class="card">
    <h2>Калории по дням</h2>
    ${weekBarsHTML(rows, g)}
    <div class="wtable-wrap"><table class="wtable">
      <thead><tr><th scope="col">День</th><th scope="col">Ккал</th><th scope="col">Б</th><th scope="col">Ж</th><th scope="col">У</th>${E ? `<th scope="col">${E.col}</th>` : ''}</tr></thead>
      <tbody>${rows.map((r, i) => `<tr class="${r.date === isoDate(new Date()) ? 'today' : ''}">
        <th scope="row"><button class="linkbtn" data-act="openDay" data-date="${r.date}">${WD[i]}, ${parseDate(r.date).getDate()}</button></th>
        ${r.n ? `<td>${r0(r.kcal)}</td><td>${r0(r.p)}</td><td>${r0(r.f)}</td><td>${r0(r.c)}</td>${E ? ev(r) : ''}` : `<td colspan="${E ? 5 : 4}" class="muted">нет записей</td>`}
      </tr>`).join('')}</tbody>
      <tfoot><tr><th scope="row">Среднее</th><td>${r0(A.kcal)}</td><td>${r0(A.p)}</td><td>${r0(A.f)}</td><td>${r0(A.c)}</td>${E ? ev(A) : ''}</tr></tfoot>
    </table></div>
  </section>`;
}

/* ---------- energy balance for the week ---------- */
const KCAL_PER_G_FAT = 7.7; // ≈ 7 700 kcal per kg of body fat
function energyCalc() {
  const auto = computeGoal({ ...S.profile, manual: false }), g = computeGoal(S.profile);
  if (!auto || !g) return null;
  const mode = S.profile.goal || 'lose', tdee = auto.tdee, norm = g.kcal;
  return { mode, tdee, norm,
    col: mode === 'lose' ? 'Дефицит' : mode === 'gain' ? 'Профицит' : 'Баланс',
    dayVal: r => mode === 'lose' ? tdee - r.kcal : r.kcal - tdee };
}
const signed = v => (v > 0 ? '+' : v < 0 ? '−' : '') + r0(Math.abs(v));
const gFat = kcal => r0(Math.abs(kcal) / KCAL_PER_G_FAT);

function energyHTML(filled, E) {
  if (!E) return `<section class="card"><h2>Расход и дефицит</h2><p class="fine">Чтобы посчитать, сколько калорий ты тратишь, заполни пол, возраст, рост и вес в параметрах (шестерёнка вверху).</p></section>`;
  const n = filled.length, burned = E.tdee * n, eaten = filled.reduce((a, r) => a + r.kcal, 0);
  const dayWord = n === 1 ? 'день' : n < 5 ? 'дня' : 'дней';
  const lines = `<div class="enlines num">
      <span>Потрачено<b>${r0(burned)} ккал</b></span>
      <span>Съедено<b>${r0(eaten)} ккал</b></span>
      <span>Расход в день<b>${r0(E.tdee)} ккал</b></span>
    </div>`;
  const low = filled.filter(r => r.kcal < E.norm * 0.75).length;
  const lowNote = low ? `<p class="ennote">${low === 1 ? 'В один день' : `В ${low} ${low < 5 ? 'дня' : 'дней'}`} съедено заметно меньше нормы. Сильное недоедание тяжело держать, и оно может замедлять похудение. Лучше держаться ближе к норме.</p>` : '';
  const fine = `<p class="fine">Оценка по ${n} ${dayWord} с записями: расход посчитан по параметрам, жир — из расчёта ≈ 7 700 ккал на 1 кг. Вес на весах колеблется из-за воды, поэтому реальный результат лучше смотреть по взвешиваниям за несколько недель.</p>`;

  if (E.mode === 'lose') {
    const deficit = burned - eaten, planned = (E.tdee - E.norm) * n, extra = E.norm * n - eaten;
    const planPart = Math.max(0, Math.min(planned, deficit)), extraPart = Math.max(0, extra), total = planPart + extraPart;
    const head = deficit > 0
      ? `<div class="kcal-big num">≈ ${gFat(deficit)}<small>г жира</small></div><p class="fine num">Дефицит ${r0(deficit)} ккал за ${n} ${dayWord}</p>`
      : `<div class="kcal-big num">0<small>г жира</small></div><p class="fine num">Дефицита нет: съедено на ${r0(-deficit)} ккал больше, чем потрачено</p>`;
    const barHTML = total > 0 ? `<div class="enbar" role="img" aria-label="По плану ${r0(planPart)} ккал, сверх плана ${r0(extraPart)} ккал">
        ${planPart ? `<i class="pl" style="width:${planPart / total * 100}%"></i>` : ''}${extraPart ? `<i class="ex" style="width:${extraPart / total * 100}%"></i>` : ''}</div>` : '';
    const legend = `<ul class="enlegend num">
        <li><i class="sw pl"></i><span>По плану</span><b>${r0(planPart)} ккал · ≈ ${gFat(planPart)} г</b></li>
        ${extra >= 0
          ? `<li><i class="sw ex"></i><span>Сверх плана (съедено меньше нормы)</span><b>${r0(extraPart)} ккал · ≈ ${gFat(extraPart)} г</b></li>`
          : `<li><i class="sw ov"></i><span>Съедено больше нормы</span><b>${r0(-extra)} ккал · −${gFat(-extra)} г от плана</b></li>`}
      </ul>`;
    return `<section class="card encard"><h2>Дефицит за неделю</h2><div class="enhead">${head}</div>${barHTML}${legend}${lines}${lowNote}${fine}</section>`;
  }
  if (E.mode === 'gain') {
    const surplus = eaten - burned, planned = (E.norm - E.tdee) * n, diff = eaten - E.norm * n;
    const head = surplus > 0
      ? `<div class="kcal-big num">+${r0(surplus)}<small>ккал сверх расхода</small></div><p class="fine num">По плану +${r0(planned)} ккал · ${diff >= 0 ? `съедено на ${r0(diff)} больше нормы` : `не добрано до нормы ${r0(-diff)}`}</p>`
      : `<div class="kcal-big num">0<small>ккал профицита</small></div><p class="fine num">Съедено на ${r0(-surplus)} ккал меньше, чем потрачено</p>`;
    return `<section class="card encard"><h2>Профицит за неделю</h2><div class="enhead">${head}</div>${lines}${fine}</section>`;
  }
  const bal = eaten - burned;
  return `<section class="card encard"><h2>Баланс за неделю</h2><div class="enhead">
      <div class="kcal-big num">${signed(bal)}<small>ккал</small></div>
      <p class="fine num">${Math.abs(bal) < 100 * n ? 'Почти ровно в расход — вес должен держаться.' : bal < 0 ? `Меньше расхода, ≈ ${gFat(bal)} г жира ушло` : `Больше расхода, ≈ ${gFat(bal)} г могло добавиться`}</p></div>${lines}${fine}</section>`;
}

function donutHTML(A, g) {
  const parts = [['p', 'Белки', A.p * 4, A.p, g && g.p], ['f', 'Жиры', A.f * 9, A.f, g && g.f], ['c', 'Углеводы', A.c * 4, A.c, g && g.c]];
  const total = parts.reduce((a, x) => a + x[2], 0);
  const R = 46, C = 2 * Math.PI * R, GAP = total ? 2 : 0;
  let off = 0;
  const segs = total ? parts.filter(x => x[2] > 0).map(x => {
    const len = x[2] / total * C, vis = Math.max(0, len - GAP);
    const s = `<circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--${x[0] === 'p' ? 'prot' : x[0] === 'f' ? 'fat' : 'carb'})" stroke-width="18" stroke-dasharray="${vis.toFixed(2)} ${(C - vis).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"><title>${x[1]}: ${Math.round(x[2] / total * 100)}% калорий</title></circle>`;
    off += len; return s;

function weekBarsHTML(rows, g) {

/* ---------- dishes: a product made of other products ---------- */
const MAC = ['kcal', 'p', 'f', 'c'];
function dishCalc(d) {
  const t = { kcal: 0, p: 0, f: 0, c: 0 }; let raw = 0;
  for (const it of d.items) {
    const cur = S.products[it.pid], src = cur && !cur.recipe ? cur : it, g = num(it.g) || 0;
    raw += g; for (const k of MAC) t[k] += (src[k] || 0) * g / 100;
  }
  const W = num(d.yield) > 0 ? num(d.yield) : raw;
  const per = W > 0 ? Object.fromEntries(MAC.map(k => [k, t[k] / W * 100])) : null;
  return { t, raw, W, per };
}
/* Price of 100 g: shop price for products, sum of ingredients for dishes. */
function costPer100(pid, depth = 0) {
  const p = S.products[pid]; if (!p) return null;
  if (p.recipe && depth < 3) {
    let sum = 0, raw = 0;
    for (const it of p.recipe.items) { const c = costPer100(it.pid, depth + 1); if (c == null) return null; const g = num(it.g) || 0; sum += c * g / 100; raw += g; }
    const W = num(p.recipe.yield) > 0 ? num(p.recipe.yield) : raw;
    return W > 0 ? sum / W * 100 : null;
  }
  const b = bestPrice(pid); return b ? b.v : null;
}

/* How many portions a saved dish is split into (older dishes stored a portion weight instead). */
function dishPortions(p) {
  if (p.recipe.portions > 0) return String(p.recipe.portions);
  const W = dishCalc(p.recipe).W;
  return p.piece > 0 && W > 0 ? String(Math.max(1, Math.round(W / p.piece))) : '1';
}

async function saveDish() {
  syncDishFields();
  const m = S.modal, d = m.data, name = d.name.trim(), portions = num(d.portions);
  let err = '';
  if (!name) err = 'Введите название блюда.';
  else if (!d.items.length) err = 'Добавьте хотя бы один ингредиент.';
  else if (d.items.some(it => !(num(it.g) > 0))) err = 'У каждого ингредиента нужен вес больше нуля.';
  else if (!(portions > 0)) err = 'Укажите, на сколько порций делится блюдо (например, 1).';
  else if (d.cat === '__new' && !d.newcat.trim()) err = 'Введите название новой категории.';
  if (err) { m.err = err; const e = $('#dm-err'); e.textContent = err; e.hidden = false; return; }
  const cat = d.cat === '__new' ? addCategory(d.newcat) : d.cat;
  const items = d.items.map(it => { const cur = S.products[it.pid], src = cur || it; return { pid: it.pid, g: num(it.g), name: src.name, kcal: src.kcal, p: src.p, f: src.f, c: src.c }; });
  const recipe = { items, yield: null, portions };
  const calc = dishCalc(recipe), per = calc.per;
  const r = v => Math.round(v * 10) / 10;
  const prod = { id: m.editId || newId(), name, kcal: r(per.kcal), p: r(per.p), f: r(per.f), c: r(per.c), piece: Math.round(calc.W / portions * 10) / 10, cat: cat || '', onlyShop: '', recipe };
  S.products[prod.id] = prod;

  S.modal = null;
  if (fromAdd && S.ui.adding) { if (selIdx(prod.id) < 0) S.ui.sel.push({ pid: prod.id, qty: prod.piece ? '1' : '100', unit: prod.piece ? 'pc' : 'g' }); S.ui.query = ''; }
  render();
  await run(S.store.saveProduct(prod));
}
/* When a product changes, dishes made from it are recounted. */
function refreshDishes(pid) {
  for (const p of Object.values(S.products)) {
    if (!p.recipe || !p.recipe.items.some(it => it.pid === pid)) continue;
    const per = dishCalc(p.recipe).per; if (!per) continue;
    const r = v => Math.round(v * 10) / 10;
    const np = { ...p, kcal: r(per.kcal), p: r(per.p), f: r(per.f), c: r(per.c) };
    S.products[p.id] = np; run(S.store.saveProduct(np));

/* ---------- categories ---------- */
const UNCAT = '_none';
const hasCat = id => !!id && S.categories.some(c => c.id === id);
const sortedCats = () => [...S.categories].sort((a, b) => a.name.localeCompare(b.name, 'ru'));
const alpha = (a, b) => a.name.localeCompare(b.name, 'ru', { numeric: true });

function filteredProducts(q, cat) {
  const nq = norm(q);
  return Object.values(S.products)
    .filter(p => !nq || norm(p.name).includes(nq))
    .filter(p => cat === 'all' || (cat === UNCAT ? !hasCat(p.cat) : p.cat === cat))
    .sort(alpha);
}
/* Groups in display order: categories A→Я, «Без категории» last; products A→Я inside each. */
function productGroups(q, cat) {
  const list = filteredProducts(q, cat);
  if (cat !== 'all') return [{ id: cat, name: '', items: list }];
  const groups = sortedCats().map(c => ({ id: c.id, name: c.name, items: [] }));
  const byId = Object.fromEntries(groups.map(g => [g.id, g]));
  const other = { id: UNCAT, name: 'Без категории', items: [] };
  list.forEach(p => (byId[p.cat] || other).items.push(p));
  return [...groups, other].filter(g => g.items.length);
}
const visibleProducts = (q, cat) => productGroups(q, cat).filter(g => cat !== 'all' || !isCollapsed(g.id, q)).flatMap(g => g.items);

/* Every group starts collapsed when the app opens; a search query opens everything. */
const expanded = new Set();
const isCollapsed = (id, q) => !norm(q) && !expanded.has(id);
function toggleGroup(id) { expanded.has(id) ? expanded.delete(id) : expanded.add(id); }
function groupHead(g, q) {

}

/* counts (optional): {all: n, <catId>: n, _none: n} — shown in brackets; empty categories are hidden then. */
function chipsHTML(sel, act, counts) {
  const anyUncat = counts ? counts[UNCAT] > 0 : Object.values(S.products).some(p => !hasCat(p.cat));
  const chip = (id, name) => {
    if (counts && id !== 'all' && id !== sel && !counts[id]) return '';
    return `<button class="chip" data-act="${act}" data-cat="${esc(id)}" aria-pressed="${sel === id}">${esc(name)}${counts ? ` <span class="ccount">(${counts[id] || 0})</span>` : ''}</button>`;
  };
  return `<div class="chips" role="group" aria-label="Категория">${chip('all', 'Все')}${sortedCats().map(c => chip(c.id, c.name)).join('')}${anyUncat || sel === UNCAT ? chip(UNCAT, 'Без категории') : ''}</div>`;
}
function saveCats() { return run(S.store.saveCats(clone(S.categories))); }
function addCategory(name) {
  name = name.trim(); if (!name) return null;
  const same = S.categories.find(c => norm(c.name) === norm(name));
  if (same) return same.id;
  const c = { id: 'cat-' + newId(), name };

function qtyFootHTML() {

function refreshQty(i) {
  const s = S.ui.sel[i]; if (!s) return;
  const k = document.querySelector(`[data-selk="${i}"]`); if (k) k.innerHTML = qMetaHTML(s);
  const tot = $('#sel-total'); if (tot) tot.innerHTML = selTotalHTML();
}
function selQtyInput(t) {
  const i = Number(t.dataset.selq), s = S.ui.sel[i]; if (!s) return;
  s.qty = t.value; t.classList.remove('bad'); refreshQty(i);
}
const STEP = { pc: 0.5, g: 10, kcal: 10 };
function selStep(i, d) {
  const s = S.ui.sel[i]; if (!s) return;
  const st = STEP[s.unit] || 1, q = num(s.qty) || 0;
  const nq = Math.max(st, Math.round((q + d * st) / st) * st);
  s.qty = String(Math.round(nq * 10) / 10);
  const el = document.getElementById('sq-' + i); if (el) { el.value = s.qty; el.classList.remove('bad'); }
  refreshQty(i);
}
function selUnitChange(i, unit) {
  const s = S.ui.sel[i], p = s && S.products[s.pid]; if (!p) return;
  const g = selGrams(s); s.unit = unit;
  if (g) s.qty = String(unit === 'pc' ? (Math.round(g / p.piece * 2) / 2 || 0.5) : unit === 'kcal' ? Math.round(g * p.kcal / 100) : Math.round(g));
  const el = document.getElementById('sq-' + i); if (el) el.value = s.qty;
  refreshQty(i);
}
function addSelected() {
  const meal = findMeal(S.ui.adding); if (!meal) return;
  const bad = S.ui.sel.findIndex(s => !selGrams(s));
  if (bad >= 0) { const el = document.getElementById('sq-' + bad); if (el) { el.classList.add('bad'); el.focus(); } return; }
  const added = S.ui.sel.map(s => {
    const p = S.products[s.pid], g = selGrams(s);
    return { id: newId(), pid: p.id, name: p.name, grams: Math.round(g * 10) / 10, kcal: p.kcal, p: p.p, f: p.f, c: p.c, piece: p.piece || null };
  });
  meal.items.push(...added);
  touchDay();
  S.ui.mealsClosed.delete(meal.id);
  closeSheet();
  showUndo(meal, added);
}

/* The phone's Back button steps back inside the sheet instead of leaving the app. */
function openAdd(mealId) {
  S.ui.adding = mealId; S.ui.query = ''; S.ui.sel = []; S.ui.step = 'pick'; S.ui.addCat = 'all';
  try { history.pushState({ sheet: 1 }, ''); } catch (e) {}
  render(); focus('#add-search');
}
function doCloseSheet() { S.ui.adding = null; S.ui.sel = []; S.ui.step = 'pick'; S.ui.query = ''; render(); }
let sheetClosing = false;
function closeSheet() {
  if (history.state && history.state.sheet) { sheetClosing = true; history.back(); } // popstate finishes the closing
  else doCloseSheet();
}
function sheetBack() {
  if (S.ui.step === 'qty') { S.ui.step = 'pick'; render(); return; }
  closeSheet();
}
window.addEventListener('popstate', () => {
  if (!S.ui.adding) { sheetClosing = false; return; }
  if (sheetClosing) { sheetClosing = false; doCloseSheet(); return; }
  if (S.ui.step === 'qty') { S.ui.step = 'pick'; try { history.pushState({ sheet: 1 }, ''); } catch (e) {} render(); return; }
  doCloseSheet();
});

function findMeal(id) { return S.day.meals.find(m => m.id === id); }

/* On touch screens the product search waits for a tap, so the keyboard doesn't pop up on its own. */
const touchUI = () => { try { return matchMedia('(pointer: coarse)').matches; } catch (e) { return false; } };
function focus(sel) { if (sel === '#add-search' && touchUI()) return; setTimeout(() => { const el = $(sel); if (el) { el.focus(); if (el.select && el.type !== 'search') el.select(); } }, 0); }

function moveMeal(id, to) {
  const arr = S.day.meals, from = arr.findIndex(m => m.id === id);
  if (from < 0) return;
  const [m] = arr.splice(from, 1);
  arr.splice(Math.max(0, Math.min(arr.length, to)), 0, m);
  touchDay(); render();
}
