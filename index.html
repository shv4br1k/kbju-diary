async function saveProductForm() {
  const m = S.modal;
  const name = $('#pm-name').value.trim();
  const vals = ['kcal', 'p', 'f', 'c'].map(k => num($('#pm-' + k).value));
  const pieceRaw = $('#pm-piece').value.trim();
  const piece = pieceRaw ? num(pieceRaw) : null;
  const catVal = $('#pm-cat').value, newCat = $('#pm-newcat').value.trim();
  const onlyShop = $('#pm-only') && $('#pm-only').checked ? $('#pm-onlyshop').value : '';
  m.data = { name, kcal: $('#pm-kcal').value, p: $('#pm-p').value, f: $('#pm-f').value, c: $('#pm-c').value, piece: pieceRaw, cat: catVal, newcat: newCat, onlyShop };
  let err = '';
  if (!name) err = 'Введите название.';
  else if (catVal === '__new' && !newCat) err = 'Введите название новой категории или выберите существующую.';
  else if (vals.some(v => !(v >= 0))) err = 'Заполните калории, белки, жиры и углеводы числами (можно 0).';
  else if (pieceRaw && !(piece > 0)) err = 'Вес штуки должен быть больше нуля или оставьте поле пустым.';
  if (err) { m.err = err; const e = $('#pm-err'); e.textContent = err; e.hidden = false; return; }
  const cat = catVal === '__new' ? addCategory(newCat) : catVal;
  const prod = { id: m.editId || newId(), name, kcal: vals[0], p: vals[1], f: vals[2], c: vals[3], piece: piece || null, cat: cat || '', onlyShop };
  if (m.editId && S.products[m.editId] && S.products[m.editId].recipe) prod.recipe = S.products[m.editId].recipe;
  S.products[prod.id] = prod;
  delete S.pxOnly[prod.id];
  /* Sold in one shop only: prices from other shops are no longer relevant. */
  if (onlyShop) {
    let dropped = false;
    for (const tbl of [S.prices.prices, S.pxDraft || {}]) { const row = tbl[prod.id]; if (row) for (const sid of Object.keys(row)) if (sid !== onlyShop) { delete row[sid]; if (tbl === S.prices.prices) dropped = true; } }
    if (dropped) savePrices();
  }
  const fromAdd = m.fromAdd;
  S.modal = null;
  if (fromAdd && S.ui.adding) { if (selIdx(prod.id) < 0) S.ui.sel.push({ pid: prod.id, qty: prod.piece ? '1' : '100', unit: prod.piece ? 'pc' : 'g' }); S.ui.query = ''; }
  render();
  await run(S.store.saveProduct(prod));
  refreshDishes(prod.id);
}

async function exportData() {
  S.ui.msg = '';
  let days = {};
  try { await flushDay(); days = await S.store.allDays(); } catch (e) { S.ui.msg = 'Не получилось собрать дни. Попробуйте ещё раз.'; render(); return; }
  const data = { app: 'kbju-diary', version: 2, exportedAt: new Date().toISOString(), profile: S.profile, categories: S.categories, prices: S.prices, products: Object.values(S.products), days };
  const text = JSON.stringify(data, null, 1);
  const filename = `kbju-backup-${S.date}.json`;
  if (S.downloads) {
    try { await S.downloads.save({ filename, data: text }); S.ui.msg = 'Копия сохранена.'; render(); return; }
    catch (e) { if (e && e.code === 'declined') return; if (e && e.code === 'rate_limited') { S.ui.msg = 'Окно сохранения уже открыто.'; render(); return; } }
  }
  try {
    const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    S.ui.msg = 'Копия сохранена в загрузки.'; render();
  } catch (e) { S.ui.exportText = text; render(); }
}

function readImport(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const d = JSON.parse(reader.result);
      if (!d || !Array.isArray(d.products) || typeof d.days !== 'object') throw new Error();
      S.ui.importData = { profile: d.profile || null, prices: d.prices && Array.isArray(d.prices.shops) ? d.prices : null, categories: Array.isArray(d.categories) ? d.categories.filter(c => c && c.id && c.name) : [], products: d.products.filter(p => p && p.id && p.name), days: d.days || {} };
      S.ui.msg = '';
    } catch (e) { S.ui.importData = null; S.ui.msg = 'Этот файл не похож на копию дневника.'; }
    render();
  };
  reader.readAsText(file);
}

async function applyImport() {
  const d = S.ui.importData; if (!d) return;
  S.ui.importData = null; S.ui.msg = 'Загружаю…'; render();
  let ok = true;
  setStatus('saving');
  try {
    if (d.profile) { S.profile = { ...DEFAULT_PROFILE, ...d.profile, seeded: true }; S.pdraft = null; await S.store.saveProfile(S.profile); }
    if (d.categories.length) {
      const byId = Object.fromEntries(S.categories.map(c => [c.id, c]));
      d.categories.forEach(c => { byId[String(c.id)] = { id: String(c.id), name: String(c.name) }; });
      S.categories = Object.values(byId);
      await S.store.saveCats(clone(S.categories));
    }
    if (d.prices) {
      const shops = Object.fromEntries(S.prices.shops.map(x => [x.id, x]));
      d.prices.shops.forEach(x => { if (x && x.id && x.name) shops[String(x.id)] = { id: String(x.id), name: String(x.name) }; });
      const pr = clone(S.prices.prices);
      for (const [pid, row] of Object.entries(d.prices.prices || {})) pr[pid] = { ...(pr[pid] || {}), ...row };
      S.prices = { shops: Object.values(shops), prices: pr, showCost: !!d.prices.showCost || S.prices.showCost };
      S.pxDraft = null;
      await S.store.savePrices(clone(S.prices));
    }
    for (const p of d.products) await S.store.saveProduct({ id: String(p.id), name: String(p.name), kcal: +p.kcal || 0, p: +p.p || 0, f: +p.f || 0, c: +p.c || 0, piece: +p.piece || null, cat: p.cat ? String(p.cat) : '', onlyShop: p.onlyShop ? String(p.onlyShop) : '', ...(p.recipe && Array.isArray(p.recipe.items) ? { recipe: p.recipe } : {}) });
    for (const [date, day] of Object.entries(d.days)) if (/^\d{4}-\d{2}-\d{2}$/.test(date) && day && Array.isArray(day.meals)) await S.store.saveDay(date, day);
    setStatus('saved');
  } catch (e) { ok = false; setStatus('error'); }
  if (ok) await loadDay(S.date);
  S.ui.msg = ok ? 'Копия загружена.' : 'Загрузилось не всё. Проверьте связь и попробуйте снова.';
  render();
}

function shiftDay(delta) {
  const d = parseDate(S.date); d.setDate(d.getDate() + delta);
  goDay(isoDate(d));
}
/* Undo for the last added product: a toast with a button, open for 8 seconds. */
let undo = null, undoTimer = null;
function showUndo(meal, items) {
  items = [].concat(items);
  undo = { date: S.date, meal: meal.id, items: items.map(i => i.id) };
  const el = $('#toast');
  const n = items.length, word = n % 10 === 1 && n % 100 !== 11 ? 'продукт' : [2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100) ? 'продукта' : 'продуктов';
  el.innerHTML = `<span>${n === 1 ? `Добавлено: ${esc(items[0].name)}` : `Добавлено ${n} ${word}`}</span><button class="btn sm" data-act="undoAdd">Отменить</button>`;
  el.hidden = false;
  clearTimeout(undoTimer); undoTimer = setTimeout(hideUndo, 8000);
}
function hideUndo() { undo = null; clearTimeout(undoTimer); const el = $('#toast'); if (el) el.hidden = true; }
function undoAdd() {
  const u = undo; hideUndo();
  if (!u || u.date !== S.date) return;
  const m = findMeal(u.meal); if (!m) return;
  const before = m.items.length;
  m.items = m.items.filter(i => !u.items.includes(i.id));
  if (m.items.length !== before) { touchDay(); render(); }
}

async function goDay(date) {
  hideUndo();
  S.ui.adding = null; S.ui.confirmDel = null;
  await loadDay(date); render();
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act], [data-tab]');
  if (!t) return;
  if (t.matches('.tabs [data-tab]') || t.dataset.act === 'tab') {
    S.tab = t.dataset.tab; S.ui.adding = null;
    if (S.tab === 'week') S.weekData = null;
    try { localStorage.setItem('kbju.tab', S.tab); } catch (err) {}
    render(); window.scrollTo(0, 0); return;
  }
  const a = t.dataset.act, mid = t.dataset.meal;
  switch (a) {
    case 'prevDay': shiftDay(-1); break;
    case 'nextDay': shiftDay(1); break;
    case 'today': goDay(isoDate(new Date())); break;
    case 'openAdd': openAdd(mid); break;
    case 'closeAdd': case 'sheetCancel': closeSheet(); break;
    case 'sheetBack': sheetBack(); break;
    case 'selStep': selStep(Number(t.dataset.i), Number(t.dataset.d)); break;
    case 'toggleSel': toggleSel(t.dataset.pid, t); break;
    case 'selNext': if (S.ui.sel.length) { S.ui.step = 'qty'; render(); setTimeout(() => { const el = $('#sq-0'); if (el && !touchUI()) { el.focus(); el.select(); } }, 0); } break;
    case 'selRemove': S.ui.sel.splice(Number(t.dataset.i), 1); if (!S.ui.sel.length) S.ui.step = 'pick'; render(); break;
    case 'selAdd': addSelected(); break;
    case 'toggleMeal': {
      const id = mid;
      if (S.ui.mealsClosed.has(id)) S.ui.mealsClosed.delete(id); else { S.ui.mealsClosed.add(id); if (S.ui.adding === id) S.ui.adding = null; }
      render(); document.querySelector(`[data-act="toggleMeal"][data-meal="${CSS.escape(id)}"]`)?.focus(); break;
    }
    case 'undoAdd': undoAdd(); break;
    case 'install': if (installEvt) { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; $('#installbtn').hidden = true; }); } break;
    case 'prevWeek': S.week = addDays(S.week, -7); render(); break;
    case 'nextWeek': S.week = addDays(S.week, 7); render(); break;
    case 'thisWeek': S.week = mondayOf(isoDate(new Date())); render(); break;
    case 'openDay': S.tab = 'diary'; try { localStorage.setItem('kbju.tab', 'diary'); } catch (err) {} goDay(t.dataset.date); window.scrollTo(0, 0); break;
    case 'delItem': { const m = findMeal(mid); if (m) { m.items = m.items.filter(i => i.id !== t.dataset.item); touchDay(); render(); } break; }
    case 'addSnack': {
      const id = 'snack-' + newId();
      S.day.meals.splice(Number(t.dataset.pos), 0, { id, type: 'snack', items: [] });
      touchDay(); openAdd(id); break;
    }
    case 'moveUp': moveMeal(mid, S.day.meals.findIndex(m => m.id === mid) - 1); break;
    case 'moveDown': moveMeal(mid, S.day.meals.findIndex(m => m.id === mid) + 1); break;
    case 'delSnack': {
      const m = findMeal(mid);
      if (m && m.items.length) { S.ui.confirmDel = mid; render(); }
      else { S.day.meals = S.day.meals.filter(x => x.id !== mid); if (S.ui.adding === mid) S.ui.adding = null; touchDay(); render(); }
      break;
    }
    case 'delSnackYes': S.day.meals = S.day.meals.filter(x => x.id !== mid); S.ui.confirmDel = null; if (S.ui.adding === mid) S.ui.adding = null; touchDay(); render(); break;
    case 'cancelConfirm': S.ui.confirmDel = null; S.ui.confirmProd = null; S.ui.confirmCat = null; S.ui.confirmShop = null; if (S.modal) renderModal(); else render(); break;
    case 'newProduct': openProductModal(null, t.dataset.fromadd === '1'); break;
    case 'editProduct': if (S.products[t.dataset.pid] && S.products[t.dataset.pid].recipe) openDishModal(t.dataset.pid, false); else openProductModal(t.dataset.pid, false); break;
    case 'newDish': openDishModal(null, t.dataset.fromadd === '1'); break;
    case 'dishAdd': dishAdd(t.dataset.pid); break;
    case 'dishDel': syncDishFields(); S.modal.data.items.splice(Number(t.dataset.i), 1); rerenderDish(); break;
    case 'delProduct': S.ui.confirmProd = t.dataset.pid; $('#plist').innerHTML = plistHTML(); break;
    case 'delProductYes': { const id = t.dataset.pid; delete S.products[id]; S.ui.confirmProd = null; $('#plist').innerHTML = plistHTML(); run(S.store.deleteProduct(id)); break; }
    case 'closeModal': closeModal(); break;
    case 'overlay': if (e.target === t && S.modal && S.modal.kind !== 'dish') closeModal(); break;
    case 'catFilter': S.ui.catFilter = t.dataset.cat; $('#prod-chips').innerHTML = chipsHTML(S.ui.catFilter, 'catFilter'); $('#plist').innerHTML = plistHTML(); break;
    case 'addCat': S.ui.addCat = t.dataset.cat; $('#add-results').innerHTML = resultsHTML(); break;
    case 'pxCat': S.ui.pxCat = t.dataset.cat; $('#px-chips').innerHTML = chipsHTML(S.ui.pxCat, 'pxCat'); rerenderPx(); break;
    case 'pxShop': S.ui.pxShop = t.dataset.sid; $('#ptable').innerHTML = ptableHTML(); break;
    case 'pxEntryToggle':
      pxEntryOpen = !pxEntryOpen; t.setAttribute('aria-expanded', String(pxEntryOpen)); $('#px-entry').hidden = !pxEntryOpen;
      break;
    case 'pxApply': applyPrices(); break;
    case 'pxCancel': S.pxDraft = clone(S.prices.prices); S.pxOnly = {}; S.ui.pxErr = ''; S.ui.pxBad = new Set(); render(); break;
    case 'manageShops': S.modal = { kind: 'shops' }; S.ui.confirmShop = null; renderModal(); focus('#shop-new'); break;
    case 'shopLeft': moveShop(t.dataset.sid, -1); break;
    case 'shopRight': moveShop(t.dataset.sid, 1); break;
    case 'delShop': S.ui.confirmShop = t.dataset.sid; renderModal(); break;
    case 'delShopYes': {
      const id = t.dataset.sid;
      S.prices.shops = S.prices.shops.filter(x => x.id !== id);
      for (const tbl of [S.prices.prices, S.pxDraft || {}]) for (const row of Object.values(tbl)) delete row[id];
      for (const pr of Object.values(S.products)) if (pr.onlyShop === id) { const np = { ...pr, onlyShop: '' }; S.products[pr.id] = np; run(S.store.saveProduct(np)); }
      for (const k of Object.keys(S.pxOnly)) if (S.pxOnly[k] === id) delete S.pxOnly[k];
      S.ui.confirmShop = null; savePrices(); renderModal();
      break;
    }
    case 'toggleGroup': {
      toggleGroup(t.dataset.gid);
      const inAdd = !!t.closest('#add-results'), inPx = !!t.closest('#ptable'), inCmp = !!t.closest('#cmptable');
      const box = inAdd ? $('#add-results') : inPx ? $('#ptable') : inCmp ? $('#cmptable') : $('#plist');
      box.innerHTML = inAdd ? resultsHTML() : inPx ? ptableHTML() : inCmp ? cmpTableHTML() : plistHTML();
      const again = box.querySelector(`[data-gid="${CSS.escape(t.dataset.gid)}"]`);
      if (again) again.focus();
      break;
    }
    case 'manageCats': S.modal = { kind: 'cats' }; S.ui.confirmCat = null; renderModal(); focus('#cat-new'); break;
    case 'delCat': S.ui.confirmCat = t.dataset.cid; renderModal(); break;
    case 'delCatYes': {
      const id = t.dataset.cid;
      S.categories = S.categories.filter(c => c.id !== id);
      S.ui.confirmCat = null; renderModal();
      saveCats();
      for (const p of Object.values(S.products)) if (p.cat === id) { const np = { ...p, cat: '' }; S.products[p.id] = np; run(S.store.saveProduct(np)); }
      renderModal();
      break;
    }
    case 'sex': S.pdraft.sex = t.dataset.v; render(); break;
    case 'goal': S.pdraft.goal = t.dataset.v; render(); break;
    case 'applyProf': S.profile = clone(S.pdraft); touchProfile(); render(); break;
    case 'cancelProf': S.pdraft = clone(S.profile); render(); break;
    case 'export': exportData(); break;
    case 'importYes': applyImport(); break;
    case 'importNo': S.ui.importData = null; render(); break;
    case 'copyExport': {
      const ta = $('#export-text');
      try { await navigator.clipboard.writeText(S.ui.exportText); t.textContent = 'Скопировано'; }
      catch (err) { ta.focus(); ta.select(); t.textContent = 'Выделено — нажмите Ctrl+C'; }
      break;
    }
  }
});

document.addEventListener('change', e => {

  } else if (t.dataset.catname) {

  } else if (t.dataset.shopname) {

  } else if (t.dataset.only) {

document.addEventListener('keydown', e => {

/* Week chart tooltip: hover or keyboard focus on a bar. */
function showTip(bar) {
  const tip = $('#wtip'); if (!tip || !bar) return;
  tip.textContent = bar.dataset.tip; tip.hidden = false;
  const box = tip.parentElement.getBoundingClientRect(), r = bar.getBoundingClientRect();
  const half = tip.offsetWidth / 2;
  tip.style.left = Math.min(box.width - half, Math.max(half, r.left - box.left + r.width / 2)) + 'px';
  const col = bar.querySelector('.wcol i') || bar;
  tip.style.top = Math.max(0, col.getBoundingClientRect().top - box.top - tip.offsetHeight - 22) + 'px';
}
document.addEventListener('mouseover', e => { const b = e.target.closest && e.target.closest('.wbar'); if (b) showTip(b); });
document.addEventListener('mouseout', e => { const b = e.target.closest && e.target.closest('.wbar'); if (b && !b.contains(e.relatedTarget)) { const t = $('#wtip'); if (t) t.hidden = true; } });
document.addEventListener('focusin', e => { if (e.target.classList && e.target.classList.contains('wbar')) showTip(e.target); });

/* Drag & drop for snacks (mouse). Arrows ↑↓ cover touch screens. */
let dragId = null;
document.addEventListener('dragstart', e => {
  const h = e.target.closest && e.target.closest('[data-handle]');
  if (!h) return;
  dragId = h.dataset.handle;
  const card = h.closest('.meal');
  card.classList.add('dragging');
  try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId); e.dataTransfer.setDragImage(card, 20, 20); } catch (err) {}
});
function clearDrop() { document.querySelectorAll('.drop-before, .drop-after, .dragging').forEach(el => el.classList.remove('drop-before', 'drop-after', 'dragging')); }
document.addEventListener('dragover', e => {
  if (!dragId) return;
  const card = e.target.closest && e.target.closest('[data-mealcard]');
  if (!card || card.dataset.mealcard === dragId) return;
  e.preventDefault();
  const r = card.getBoundingClientRect(), after = e.clientY > r.top + r.height / 2;
  document.querySelectorAll('.drop-before, .drop-after').forEach(el => el.classList.remove('drop-before', 'drop-after'));
  card.classList.add(after ? 'drop-after' : 'drop-before');
});
document.addEventListener('drop', e => {
  if (!dragId) return;
  const card = e.target.closest && e.target.closest('[data-mealcard]');
  e.preventDefault();
  if (card && card.dataset.mealcard !== dragId) {
    const after = card.classList.contains('drop-after');
    const arr = S.day.meals.filter(m => m.id !== dragId);
    let to = arr.findIndex(m => m.id === card.dataset.mealcard) + (after ? 1 : 0);
    const moving = S.day.meals.find(m => m.id === dragId);
    arr.splice(to, 0, moving); S.day.meals = arr; touchDay();
  }
  dragId = null; clearDrop(); render();
});
document.addEventListener('dragend', () => { if (dragId) { dragId = null; clearDrop(); } });

/* Refresh from other devices when the page comes back into view. */
document.addEventListener('visibilitychange', async () => {
  if (!S.store) return;
  if (document.hidden) { flushDay(); return; }
  if (dayDirty || S.ui.adding || S.modal || S.tab !== 'diary' || document.activeElement?.dataset?.grams) return;
  const date = S.date; let d = null;
  try { d = await S.store.getDay(date); } catch (e) { return; }
  if (S.date === date && !dayDirty && d && Array.isArray(d.meals) && JSON.stringify(d) !== JSON.stringify(S.day)) { S.day = d; render(); }
});

/* ---------- start ---------- */
async function init() {
  const store = makeLocalStore();
  S.store = store;
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

  let saved = null;
  try { saved = await store.getProfile(); } catch (e) {}
  S.profile = { ...DEFAULT_PROFILE, ...(saved || {}) };

  let existing = {};
  try { existing = await store.getProducts(); } catch (e) {}
  if (!S.profile.seeded) {
    try {
      for (const p of SEED) if (!existing[p.id]) { await store.saveProduct(p); existing[p.id] = p; }
      S.profile.seeded = true;
      await store.saveProfile(clone(S.profile));
    } catch (e) {}
  }
  S.products = existing;

  let cats = null;
  try { cats = await store.getCats(); } catch (e) {}
  if (!cats) {
    cats = clone(DEFAULT_CATS);
    try {
      await store.saveCats(cats);
      for (const s of SEED) { const p = existing[s.id]; if (p && !p.cat) await store.saveProduct({ ...p, cat: s.cat }); }
    } catch (e) {}
  }
  S.categories = cats;

  let px = null;
  try { px = await store.getPrices(); } catch (e) {}
  S.prices = { shops: [], prices: {}, showCost: false, ...(px || {}) };

  try {
    store.subscribeProducts(o => {
      S.products = o;
      if (!S.ready) return;
      if (S.tab === 'products' && $('#plist')) $('#plist').innerHTML = plistHTML();
      else if (S.ui.adding && S.ui.step !== 'qty' && $('#add-results')) $('#add-results').innerHTML = resultsHTML();
    }, () => {});
  } catch (e) {}

  await loadDay(S.date);
  S.ready = true;
  render();
}
init();
})();
</script>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
